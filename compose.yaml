# Local dependencies for the no cluster dev loop. Our own services run on the laptop with
# `just dev <service> <port>`; team systems are in memory fakes from tessaro-clients.
name: ask-tessaro

services:
  redis:
    image: redis:8-alpine
    # noeviction: a conversation's mapping keys must never vanish one at a time (spec 0006 AC-6)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  openfga:
    image: openfga/openfga:v1
    command: ["run"] # in memory store by default
    ports: ["18080:8080"] # HTTP API on host 18080
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      retries: 10

  opa:
    image: openpolicyagent/opa:1.21.1-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--watch", "/policy"]
    ports: ["8181:8181"]
    volumes: [./policy:/policy:ro]

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "7233:7233" # frontend
      - "8233:8233" # web UI

  presidio-analyzer:
    # Pinned by digest: the image the privacy proxy leak scan last passed against (spec 0006).
    image: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    ports: ["5002:3000"]
    environment:
      # gunicorn 25 starts its control socket thread before forking the worker; the fork can
      # inherit a held lock and the worker never boots. Presidio needs no control socket.
      GUNICORN_CMD_ARGS: --no-control-socket

volumes:
  redis-data:
