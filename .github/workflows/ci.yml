# Runs `just check` (lint, typecheck, tests with the 80% gate, policy, charts) on every push and PR,
# and the privacy proxy leak scan against a real Presidio analyzer (spec 0006).
# Image builds and pushes to GHCR on main come later, with the cluster phase (spec 0001, CI pipeline).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0
  FGA_VERSION: v0.8.1
  KUBESEAL_VERSION: 0.40.0

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: extractions/setup-just@v4.0.0

      - uses: azure/setup-helm@v5.0.1

      - uses: open-policy-agent/setup-opa@v2.4.0

      # shellcheck and yq come with the runner image; kubeseal runs the offline seal tests.
      - name: Install kubeconform, kubeseal and the OpenFGA CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          curl -fsSL "https://github.com/openfga/cli/releases/download/${FGA_VERSION}/fga_${FGA_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" fga
          curl -fsSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeseal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install packages
        run: |
          cp .env.example .env
          uv sync --all-packages --locked

      - name: Run every check
        run: just check

      # The drift tests compare against snapshots in this checkout, which the change itself can
      # edit; this compares against the snapshots released on the base branch (spec 0003 AC-19).
      - name: Check contracts against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          just contracts-check "origin/$BASE_REF"

  leak-scan:
    # The privacy proxy leak scan against the real Presidio analyzer (spec 0006 AC-13).
    name: privacy leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRESIDIO_IMAGE: mcr.microsoft.com/presidio-analyzer@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    steps:
      - uses: actions/checkout@v7.0.1

      # Started by hand, not as a service container: the runner's service health gate gives up
      # while the model is still loading on a slow runner. The wait step below is the only gate.
      - name: Start the analyzer
        run: docker run --detach --name presidio --publish 5002:3000 "$PRESIDIO_IMAGE"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: extractions/setup-just@v4.0.0

      - name: Install packages
        run: uv sync --all-packages --locked

      - name: Wait for the analyzer
        run: |
          for _ in $(seq 1 120); do
            curl -fsS http://localhost:5002/health && exit 0
            sleep 5
          done
          echo "the Presidio analyzer never became healthy" >&2
          docker logs presidio >&2
          exit 1

      - name: Run the leak scan
        env:
          PRESIDIO_ANALYZER_URL: http://localhost:5002
        run: just leak-scan
