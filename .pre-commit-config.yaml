# Checks that run on every commit. Install once with `just hooks`.
# ruff and mypy run through uv so they use the exact versions in uv.lock.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(charts/[^/]+/templates/|templates/service/values\.yaml$)
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock is current
        entry: uv lock --check
        language: system
        files: (^|/)(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy --strict (every package)
        entry: just typecheck
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: opa-fmt
        name: opa fmt (Rego)
        entry: opa fmt --fail -l
        language: system
        files: \.rego$
