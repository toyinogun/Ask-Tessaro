{{- $net := .Values.network -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tessaro.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tessaro.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tessaro.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if not $net.ingress }} []{{ end }}
    {{- range $net.ingress }}
    - from:
        {{- include "tessaro.peer" . | nindent 8 }}
      {{- if .ports }}
      {{- include "tessaro.ports" . | nindent 6 }}
      {{- end }}
    {{- end }}
  egress:
    {{- range $net.egress }}
    - to:
        {{- include "tessaro.peer" . | nindent 8 }}
      {{- if .ports }}
      {{- include "tessaro.ports" . | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if $net.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
