apiVersion: v1
kind: Service
metadata:
  name: {{ include "tessaro.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tessaro.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tessaro.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
