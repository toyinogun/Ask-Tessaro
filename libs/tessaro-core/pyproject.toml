[project]
name = "tessaro-core"
version = "0.1.0"
description = "Shared service plumbing: settings base, structlog setup, request IDs, health routes, httpx factory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "structlog>=25.4",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
