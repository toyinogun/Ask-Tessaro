[project]
name = "tessaro-dataset"
version = "0.1.0"
description = "The fictional company dataset: validated YAML, derived records and one exporter per team system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0.2",
]

[project.scripts]
tessaro-dataset = "tessaro_dataset.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
