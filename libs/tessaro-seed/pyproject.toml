[project]
name = "tessaro-seed"
version = "0.1.0"
description = "Loads the fictional company into the platform systems (Authentik and Zulip first) and smoke tests them"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.63.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "tessaro-clients",
    "tessaro-dataset",
]

[project.scripts]
tessaro-seed = "tessaro_seed.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
