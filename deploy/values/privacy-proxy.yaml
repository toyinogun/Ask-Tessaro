# Release values for privacy-proxy (chart: charts/tessaro-service). Paths: PRD 14.4.
namespace: assistant
image:
  repository: ghcr.io/REPLACE_OWNER/tessaro-privacy-proxy
  tag: scaffold # CI sets the git commit SHA
existingSecret: privacy-proxy-secrets # PROXY_UPSTREAM_API_KEY, PROXY_CLIENT_KEY, PROXY_MAPPING_KEY, PROXY_LOOKUP_KEY, Redis ACL password
# PROXY_DIRECTORY_PATH and the nightly directory job arrive with the cluster features (spec 0006 follow up).
env:
  PROXY_UPSTREAM_URL: https://api.deepseek.com
  PROXY_MAPPING_TTL_HOURS: 24
  PROXY_FAIL_CLOSED: true
network:
  ingress:
    - namespace: assistant
      podLabels: { app.kubernetes.io/name: master-agent }
      ports: [8080]
  egress:
    - namespace: assistant # Redis: encrypted pseudonym mappings
      podLabels: { app.kubernetes.io/name: redis }
      ports: [6379]
    - namespace: platform # Presidio analyzer
      podLabels: { app.kubernetes.io/name: presidio-analyzer }
  # The only internet path in the cluster (spec 0007 AC-11): a CiliumNetworkPolicy by host name.
  egressFQDNs:
    - name: api.deepseek.com
