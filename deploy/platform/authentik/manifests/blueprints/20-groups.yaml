# Generated by `just blueprints` from the dataset (spec 0008 AC-9); do not edit by hand.
# Every dataset group with `attributes.elevated`, and the seed role's permission to add and remove
# members of exactly these groups (as app_label.codename: Authentik's guardian rejects a bare
# codename even for an object permission). `just check` fails when this file is stale.
version: 1
metadata:
  name: Tessaro - dataset groups
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Declared here too (30-seed.yaml sets its permissions), so file order never matters.
  - model: authentik_rbac.role
    id: seed-role
    state: created
    identifiers:
      name: tessaro-seed
  - model: authentik_core.group
    identifiers:
      name: eng
    attrs:
      attributes:
        elevated: false
    permissions:
      - permission: authentik_core.add_user_to_group
        role: !KeyOf seed-role
      - permission: authentik_core.remove_user_from_group
        role: !KeyOf seed-role
