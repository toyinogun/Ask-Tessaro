# Zulip signs in through Authentik (spec 0008 AC-9): a confidential OAuth2/OpenID provider and the
# application `zulip`, usable only by members of `staff` and by tessaro-admin (engine mode any).
# The `profile` scope carries `groups` (the user's direct group names), so the token holds them.
version: 1
metadata:
  name: Tessaro - Zulip sign in
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # The admin binding below needs tessaro-admin, so apply that blueprint first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Tessaro - admin
      required: true
  # Declared here too, attribute free, so the binding never waits for 20-groups.yaml.
  - model: authentik_core.group
    id: staff
    state: created
    identifiers:
      name: staff
  # Authentik's built in `email` mapping always sends `email_verified: false`, and Zulip refuses
  # that. Emails here are written only by the seed and admins (users cannot change their own,
  # `default_user_change_email` is off, and the smoke checks it), so this mapping vouches for them.
  - model: authentik_providers_oauth2.scopemapping
    id: zulip-email-scope
    identifiers:
      name: "Tessaro: OpenID 'email' (verified)"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: zulip-provider
    identifiers:
      name: zulip
    attrs:
      client_type: confidential
      client_id: zulip
      # Authentik refuses any flow whose grant type is not listed; Zulip uses the code flow.
      grant_types: [authorization_code, refresh_token]
      client_secret: !Env ZULIP_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://chat.tessaro.toyintest.org/complete/oidc/
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_email
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf zulip-email-scope
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: zulip-app
    identifiers:
      slug: zulip
    attrs:
      name: Zulip
      provider: !KeyOf zulip-provider
      policy_engine_mode: any
      meta_launch_url: https://chat.tessaro.toyintest.org
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf zulip-app
      order: 0
    attrs:
      group: !KeyOf staff
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf zulip-app
      order: 1
    attrs:
      user: !Find [authentik_core.user, [username, tessaro-admin]]
