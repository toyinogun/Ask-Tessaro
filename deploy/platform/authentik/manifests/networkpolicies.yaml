# Allow policies for `identity` on top of the baseline default-deny and allow-dns, one per path in
# spec 0008 *Network paths*, following spec 0007 *Network conventions*.
---
# The UI and API through auth.tessaro.toyintest.org, and user lookups from the zulip adapter
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-server-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: assistant
          podSelector:
            matchLabels:
              app.kubernetes.io/name: zulip-adapter
      ports:
        - protocol: TCP
          port: 9000
---
# Server and worker reach their database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-to-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: authentik-db
      ports:
        - protocol: TCP
          port: 5432
---
# The database accepts Authentik on 5432 and the CNPG operator on 8000 (status) and 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-db-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: authentik-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authentik
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
