# memcached for Zulip (AC-5): official image, no password (its NetworkPolicy admits only the
# Zulip server), no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/part-of: zulip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/part-of: zulip
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 11211
        runAsGroup: 11211
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memcached
          image: docker.io/library/memcached:1.6.45-alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
          args: ["-m", "64"]
          ports:
            - name: memcached
              containerPort: 11211
          resources:
            requests:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
spec:
  selector:
    app.kubernetes.io/name: memcached
  ports:
    - name: memcached
      port: 11211
      targetPort: memcached
