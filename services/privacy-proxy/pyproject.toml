[project]
name = "privacy-proxy"
version = "0.1.0"
description = "Ask Tessaro privacy-proxy service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.120",
    "httpx>=0.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "redis>=6.4",
    "structlog>=25.4",
    "tessaro-core",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tessaro_privacy_proxy"
