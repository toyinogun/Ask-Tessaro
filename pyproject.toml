[project]
name = "ask-tessaro"
version = "0.1.0"
description = "Ask Tessaro: AI employee service desk and lifecycle orchestrator (workspace root)"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.16",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
required-version = ">=0.12"
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
tessaro-core = { workspace = true }
tessaro-auth = { workspace = true }
tessaro-contracts = { workspace = true }
tessaro-clients = { workspace = true }
tessaro-dataset = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["tessaro_*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
show_missing = true
skip_empty = true
